name: Build GKI 6.1 (KowSU + SuSFS) - Full Fix

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Nama Kernel (Opsional)'
        required: false
        default: ''
      clang_version:
        description: 'Versi Clang'
        required: true
        default: 'r536225 (Clang 19)'
        type: choice
        options:
        - 'r536225 (Clang 19)'
        - 'r547379 (Clang 20)'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Cleanup & Maximize Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v3
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('**/fix-apt-packages.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Dependencies
        run: |
          apt-get update
          # FIX: Tambahkan 'dwarves' (untuk pahole) dan 'libelf-dev'
          # Tambahkan cross-compilation tools secara eksplisit
          apt-get install -y build-essential bc bison flex libssl-dev git curl \
          python3 python3-pip lld zip unzip libncurses5-dev rsync \
          cpio schedtool git-core gnupg libelf-dev dwarves \
          aarch64-linux-gnu-gcc arm-linux-gnueabihf-gcc \
          device-tree-compiler

      - name: Cache Repo Tool
        id: cache-repo
        uses: actions/cache@v3
        with:
          path: ~/bin
          key: ${{ runner.os }}-repo-tool-${{ hashFiles('**/setup-repo.sh') }}
          restore-keys: |
            ${{ runner.os }}-repo-tool-

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          if [ ! -f ~/bin/repo ]; then
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
          fi
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global url."https://".insteadOf git://

      - name: Cache Kernel Source
        id: cache-source
        uses: actions/cache@v3
        with:
          path: gki
          key: ${{ runner.os }}-kernel-source-${{ github.event.inputs.clang_version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-source-${{ github.event.inputs.clang_version }}-

      - name: Initialize & Sync Source (GKI 6.1)
        if: steps.cache-source.outputs.cache-hit != 'true'
        run: |
          mkdir gki
          cd gki
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1
          repo sync -j$(nproc) --force-sync --no-tags --current-branch

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v3
        with:
          path: gki/toolchain/clang
          key: ${{ runner.os }}-clang-${{ github.event.inputs.clang_version }}
          restore-keys: |
            ${{ runner.os }}-clang-

      - name: Setup Custom Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        working-directory: gki
        run: |
          mkdir -p toolchain/clang
          
          if [ "${{ github.event.inputs.clang_version }}" == "r536225 (Clang 19)" ]; then
            echo "Setting up Clang-19 (r536225)..."
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          else
            echo "Setting up Clang-20 (r547379)..."
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/62cdcefa89e31af2d72c366e8b5ef8db84caea62/clang-r547379.tar.gz"
          fi
          
          echo "Downloading Clang..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang

      - name: Patch KernelSU (Official)
        working-directory: gki/common
        run: |
          echo "Setting up KowSUxSF.."
          curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/staging/kernel/setup.sh" | bash -

      - name: Patch SuSFS (Manual + Fix Conflict)
        working-directory: gki/common
        run: |
          echo "Cloning SUSFS Patches (Branch: gki-android14-6.1)..."
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android14-6.1 sus_temp
          
          cp -r sus_temp/kernel_patches/fs/* fs/
          cp -r sus_temp/kernel_patches/include/* include/
          cp sus_temp/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch .
          
          echo "Applying SUSFS Patch..."
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || echo "Some patches may have failed, continuing..."
          
          echo "Fixing fs/proc/base.c conflict..."
          grep -q "linux/susfs.h" fs/proc/base.c || sed -i '/#include <linux\/fs.h>/a #include <linux/susfs.h>' fs/proc/base.c
          
          # Clean up
          rm -rf sus_temp 50_add_susfs_in_gki-android14-6.1.patch
          find . -name "*.rej" -delete

      - name: Configure Kernel
        working-directory: gki/common
        run: |
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          
          echo "Generating GKI defconfig..."
          make O=out gki_defconfig

          # --- Inject KSU & SuSFS Config ---
          cat <<EOF >> out/.config
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_SPOOF_GENERIC=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          EOF

          # --- Logic Nama Kernel ---
          if [ ! -z "${{ github.event.inputs.kernel_name }}" ]; then
            scripts/config --file out/.config --set-str LOCALVERSION "-${{ github.event.inputs.kernel_name }}"
          else
            scripts/config --file out/.config --set-str LOCALVERSION ""
          fi

          # --- LTO Config ---
          echo "Configuring LTO..."
          scripts/config --file out/.config \
              -e LTO_CLANG \
              -d LTO_NONE \
              -e LTO_CLANG_THIN \
              -d LTO_CLANG_FULL \
              -e THINLTO

      - name: Build Kernel Image
        working-directory: gki/common
        run: |
          export PATH="$(pwd)/../toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          
          echo "Starting Build with $(nproc) jobs..."
          make -j$(nproc) O=out Image 2>&1 | tee build.log
          
          # Cek apakah build berhasil
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "Build failed! Check build.log for errors."
            tail -n 100 build.log
            exit 1
          fi

      - name: Determine Artifact Name
        id: artifact-name
        run: |
          if [ -z "${{ github.event.inputs.kernel_name }}" ]; then
            echo "NAME=GKI-Image-Android14" >> $GITHUB_ENV
          else
            echo "NAME=${{ github.event.inputs.kernel_name }}-Image" >> $GITHUB_ENV
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gki/common/build.log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: gki/common/out/arch/arm64/boot/Image
          compression-level: 9
          retention-days: 30